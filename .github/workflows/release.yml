name: Build and publish Windows setup

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Semantic version without the v prefix (for example 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    # Public releases run on GitHub's ephemeral Windows VM.  The development
    # signer is supplied only through Actions Secrets and is removed afterwards.
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PS5CAM_MANIFEST_CERTIFICATE_THUMBPRINT: EDAF55A1E4AE0C8C197988F7286626BD51228CA2
    steps:
      - uses: actions/checkout@v4
        with:
          # Release automation lives on master. The v1.0.1 tag predates the
          # hosted-runner fix, while the shipped Rust product sources remain
          # unchanged since that tag.
          ref: master
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Resolve and validate release version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.release_version }}'
          } else {
            '${{ github.ref_name }}'.Substring(1)
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Release version is invalid: $version"
          }
          if ($version -ne '1.0.1') {
            throw "This source tree is version 1.0.1; refusing to publish $version."
          }
          $tag = "v$version"
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            git show-ref --tags --verify --quiet "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Release tag $tag does not exist." }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "revision=$((git rev-list -n 1 $tag).Trim())" >> $env:GITHUB_OUTPUT
      - name: Import development signer from Actions Secrets
        id: signer
        shell: pwsh
        env:
          PS5CAM_SIGNING_PFX_BASE64: ${{ secrets.PS5CAM_SIGNING_PFX_BASE64 }}
          PS5CAM_SIGNING_PFX_PASSWORD: ${{ secrets.PS5CAM_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:PS5CAM_SIGNING_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:PS5CAM_SIGNING_PFX_PASSWORD)) {
            throw 'Release signing secrets are missing. Configure PS5CAM_SIGNING_PFX_BASE64 and PS5CAM_SIGNING_PFX_PASSWORD before publishing.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'ps5cam-release-signer.pfx'
          try {
            $encodedPfx = [regex]::Replace($env:PS5CAM_SIGNING_PFX_BASE64, '\s', '')
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($encodedPfx))
            $password = ConvertTo-SecureString -String $env:PS5CAM_SIGNING_PFX_PASSWORD -AsPlainText -Force
            $imported = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation 'Cert:\CurrentUser\My' -Password $password)
            $certificate = @($imported | Where-Object {
              $_.Thumbprint -eq $env:PS5CAM_MANIFEST_CERTIFICATE_THUMBPRINT -and $_.HasPrivateKey
            })
            if ($certificate.Count -ne 1) {
              throw 'The imported PFX does not contain the expected development signing certificate and private key.'
            }
            "thumbprint=$($certificate[0].Thumbprint)" >> $env:GITHUB_OUTPUT
          }
          finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }
      - name: Verify source
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          ./windows/package/test-package.ps1
          ./windows/installer/test-installer.ps1
      - name: Build signed setup
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $tag = '${{ steps.version.outputs.tag }}'
          $revision = '${{ steps.version.outputs.revision }}'
          $epoch = (git log -1 --format=%ct $tag).Trim()
          $run = "$version-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $catalog = Join-Path $env:RUNNER_TEMP "ps5cam-catalog-$run"
          $release = Join-Path $env:RUNNER_TEMP "ps5cam-release-$run"
          $output = Join-Path $env:RUNNER_TEMP "ps5cam-setup-$run"
          ./windows/package/package-pipeline.ps1 -Action Catalog -Execute -StagingDirectory $catalog -ConfirmHardwareId 'USB\VID_05A9&PID_0580'
          ./windows/package/package-pipeline.ps1 -Action TestSign -Execute -StagingDirectory $catalog -CertificateThumbprint $env:PS5CAM_MANIFEST_CERTIFICATE_THUMBPRINT -AllowUntrustedDevelopmentSigner -ConfirmHardwareId 'USB\VID_05A9&PID_0580'
          cargo build --release --locked -p ps5cam-service -p ps5cam-diagnostics
          ./windows/package/build-development-release.ps1 -OutputDirectory $release -ReleaseVersion $version -SourceRevision $revision -SourceDateEpoch $epoch -CatalogDirectory $catalog -ManifestCertificateThumbprint $env:PS5CAM_MANIFEST_CERTIFICATE_THUMBPRINT -AllowUntrustedCatalogSigner
          ./windows/package/build-single-file-setup.ps1 -ReleaseDirectory $release -OutputDirectory $output
          $setup = Join-Path $output 'PS5-Camera-Setup.exe'
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) { throw 'Setup executable was not produced.' }
          "setup=$setup" >> $env:GITHUB_OUTPUT
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ steps.version.outputs.revision }}
          name: PS5 Camera Windows Driver v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.build.outputs.setup }}
      - name: Remove imported release signer
        if: always()
        shell: pwsh
        run: |
          $certificatePath = "Cert:\CurrentUser\My\$env:PS5CAM_MANIFEST_CERTIFICATE_THUMBPRINT"
          if (Test-Path -LiteralPath $certificatePath) {
            Remove-Item -LiteralPath $certificatePath -Force
          }
