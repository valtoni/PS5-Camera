[package]
name = "ps5cam-uvc"
version.workspace = true
edition = "2021"
license = "MIT"
repository = "https://github.com/valtoni/PS5-Camera"
rust-version = "1.85"
description = "Platform-neutral UVC capture contract for the PS5 camera"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lib]
path = "src/lib.rs"

[[bin]]
name = "ps5cam-uvc-capture"
path = "src/main.rs"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Ole"] }
