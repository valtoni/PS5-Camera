[workspace]
members = [
    "crates/ov580-fw-analyzer",
    "crates/ov580-loader",
    "crates/ps5cam-loader-cli",
    "crates/ps5cam-diagnostics",
    "crates/ps5cam-probe",
    "crates/ps5cam-service",
    "crates/ps5cam-setup",
    "crates/ps5cam-usb",
    "crates/ps5cam-uvc",
    "rust",
]
resolver = "2"

[workspace.package]
version = "1.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/valtoni/PS5-Camera"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
rusb = "=0.9.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
